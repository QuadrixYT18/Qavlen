command:
  unknown: "Unknown command. Usage: {usage}"
  no-permission: "You do not have permission to use this command."
  usage: "Usage: {usage}"
  too-many-arguments: "Too many arguments. Usage: {usage}"
  invalid-argument: "Invalid value '{input}' for {argument}."
  invalid-number: "'{input}' is not a valid number."
  number-range: "The number must be between {min} and {max}."
  string-length: "'{input}' must be {min} to {max} characters long."
  invalid-boolean: "'{input}' must be true or false."
  invalid-choice: "'{input}' is not valid. Choose one of: {choices}."
  invalid-uuid: "'{input}' is not a valid UUID."
  invalid-duration: "'{input}' is not a valid duration, for example 1h30m."
  sender-type: "This command can only be used by a {type}."
  cooldown: "Please wait {remaining} before using this command again."
  failed: "An internal error occurred while executing this command."
  help:
    header: "Commands:"
    entry: "{usage} - {description}"
    entry-plain: "{usage}"
